name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit
    steps:
      - uses: tetherto/oss-actions/node-base@v1
      # .npmrc carries npm 12-only hardening keys (min-release-age, allow-remote,
      # allow-git). npm 11 -- what Node LTS bundles today -- warns about unknown keys
      # and then ignores them, so without this pin the policy would look enforced
      # locally while being a silent no-op in CI. Pinned to the major rather than an
      # exact version so npm's own security fixes still land.
      - run: npm install -g npm@12
      - run: npm run audit
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      # No npm pin here: node-base installs with `npm install --ignore-scripts`, so
      # this job never executes dependency lifecycle scripts, and linting does not
      # depend on the .npmrc resolution policy.
      - uses: tetherto/oss-actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: tetherto/oss-actions/node-base@v1
      # node-base pins `node-version: lts/*` and accepts no inputs, so CI's Node
      # version floats. Pin it explicitly from .nvmrc for reproducibility, then
      # reinstall so the dependency tree matches the Node we actually test on.
      # The suite needs Node >=22 (Hardhat's @nomicfoundation/edr native bindings
      # declare `engines: { node: ">= 22" }`); see package.json devEngines.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      # See the audit job. This is the `npm ci` that .npmrc's hardening keys exist
      # to govern, so the pin has to come before it. Under npm 12 the four packages
      # with install scripts (esbuild, fsevents, msgpackr-extract, unrs-resolver) are
      # blocked by the deny-by-default allowScripts policy and reported as warnings;
      # the suite does not need them.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run test:coverage
