name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit
    steps:
      - uses: tetherto/oss-actions/node-base@v1
      - run: npm run audit
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: tetherto/oss-actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: tetherto/oss-actions/node-base@v1
      # node-base pins `node-version: lts/*` and accepts no inputs, so CI's Node
      # version floats. Pin it explicitly from .nvmrc for reproducibility, then
      # reinstall so the dependency tree matches the Node we actually test on.
      # The suite needs Node >=22 (Hardhat's @nomicfoundation/edr native bindings
      # declare `engines: { node: ">= 22" }`); see package.json devEngines.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run test:coverage
